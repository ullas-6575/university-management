services:
  app:
    cap_drop:
      - ALL
    cpus: 1
    environment:
      APP_SEED_ADMIN_PASSWORD: "${APP_SEED_ADMIN_PASSWORD:-Admin1}"
      APP_SEED_ENABLED: "${APP_SEED_ENABLED:-false}"
      APP_SEED_STUDENT_PASSWORD: "${APP_SEED_STUDENT_PASSWORD:-Student1}"
      APP_SEED_TEACHER_PASSWORD: "${APP_SEED_TEACHER_PASSWORD:-Teacher1}"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    image: university-management:local
    init: true
    logging:
      options:
        max-file: "3"
        max-size: 10m
    mem_limit: "536870912"
    networks:
      default: null
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
networks:
  default:
    name: university-management_default
