services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-management:local
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-}
      APP_SEED_TEACHER_PASSWORD: ${APP_SEED_TEACHER_PASSWORD:-}
      APP_SEED_STUDENT_PASSWORD: ${APP_SEED_STUDENT_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      options:
        max-size: 10m
        max-file: "3"
