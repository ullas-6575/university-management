<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers · Campus</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><div class="title"><div><span class="eyebrow">University directory</span><h1>Teachers</h1></div><a class="button" href="/teachers/add">Add teacher</a></div><p class="notice" th:if="${message}" th:text="${message}"></p><div class="panel table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Designation</th><th>Username</th><th>Email</th><th>Actions</th></tr></thead><tbody><tr th:each="person : ${teachers}"><td th:text="${person.id}"></td><td th:text="${person.name}"></td><td th:text="${person.designation}"></td><td th:text="${person.username}"></td><td th:text="${person.email}"></td><td class="actions"><a class="button outline" th:href="@{/teachers/{id}/edit(id=${person.id})}">Edit</a><form th:action="@{/teachers/{id}/delete(id=${person.id})}" method="post" onsubmit="return confirm('Permanently delete this account?')"><button class="danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(teachers)}"><td colspan="6">No records yet.</td></tr></tbody></table><div class="pagination"><span th:text="|${result.totalElements} records · Page ${result.number + 1}|"></span><a th:if="${result.hasPrevious()}" th:href="@{/teachers(page=${result.number - 1})}">Previous</a><a th:if="${result.hasNext()}" th:href="@{/teachers(page=${result.number + 1})}">Next</a></div></div></main></body></html>
