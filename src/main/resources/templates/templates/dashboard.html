<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus · Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><span class="eyebrow">Your university workspace</span><h1>Welcome to Campus</h1><p th:text="|You are signed in as ${currentRole}. Choose a directory to manage its records.|"></p><section class="cards"><a class="panel" th:if="${currentRole == 'ADMIN'}" href="/admins"><h2>Admins</h2><p>Manage administration accounts and offices.</p></a><a class="panel" th:if="${currentRole == 'ADMIN' or currentRole == 'TEACHER'}" href="/teachers"><h2>Teachers</h2><p>Manage teacher accounts and designations.</p></a><a class="panel" th:if="${currentRole == 'ADMIN' or currentRole == 'STUDENT'}" href="/students"><h2>Students</h2><p>Manage student accounts and roll numbers.</p></a></section></main></body></html>
