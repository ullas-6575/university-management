<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin form · Campus</title><link rel="stylesheet" href="/css/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main class="form-main"><a href="/admins">← Back to admins</a><h1 th:text="${editing == true ? 'Edit admin' : 'Add admin'}"></h1><form class="panel" th:object="${admin}" th:action="${editing == true} ? @{/admins/{id}/update(id=${admin.id})} : @{/admins/store}" method="post"><div class="error" th:if="${#fields.hasErrors('*')}"><p th:each="error : ${#fields.errors('*')}" th:text="${error}"></p></div><label>Name<input th:field="*{name}" required maxlength="100"></label><label>Office<input th:field="*{office}" required maxlength="100"></label><label>Username<input th:field="*{username}" th:readonly="${editing == true}" th:required="${editing != true}" pattern="[a-z0-9][a-z0-9._-]{2,39}" maxlength="40"><small>3–40 lowercase characters. Username cannot be changed.</small></label><label>Email<input th:field="*{email}" type="email" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="new-password" th:required="${editing != true}" minlength="12" maxlength="64"><small>12–64 printable ASCII characters. Leave blank on edit to keep the current password.</small></label><div class="actions"><button>Save admin</button><a href="/admins">Cancel</a></div></form></main></body></html>
