<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus · Login</title><link rel="stylesheet" href="/css/style.css"></head><body>
<main class="login"><section><span class="eyebrow">University management</span><h1>One campus.<br>Three clear roles.</h1><p>Sign in to manage the resources available to your role.</p><p>Java Spring Boot · Thymeleaf · PostgreSQL</p></section><form class="panel" th:action="@{/login}" method="post"><span class="eyebrow">Welcome back</span><h2>Sign in</h2><p class="error" th:if="${param.error}">Invalid username or password.</p><p th:if="${param.logout}">You have been logged out.</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Login</button></form></main></body></html>
