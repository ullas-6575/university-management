spring.application.name=University-management
spring.datasource.url=jdbc:h2:mem:university;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.prefix=classpath:/templates/templates/
spring.web.resources.static-locations=classpath:/static/css/

app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:Admin1}
app.seed.teacher-password=${APP_SEED_TEACHER_PASSWORD:Teacher1}
app.seed.student-password=${APP_SEED_STUDENT_PASSWORD:Student1}
